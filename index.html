<style>
:root{--card:#f6ead6;--ink:#2b2b2b;--mut:#6b6254}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;min-height:100vh;background:radial-gradient(circle at 50% 0%,#8c1a1a,#6e1010 70%) no-repeat fixed #6e1010;color:#f6ead6}
main{max-width:640px;margin:auto;padding:16px}
.card{background:var(--card);color:#2b2b2b;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 4px #0002}
input,select,textarea,button{font:inherit;width:100%;padding:10px;margin:6px 0;border-radius:8px;border:1px solid #8885;background:#fff;color:#2b2b2b}
button{background:#fff;color:#2b2b2b;font-weight:600;border:1px solid #bfb3a0;box-shadow:0 1px 3px #0003;cursor:pointer}button.sec{background:#8884;color:var(--ink);border:0;box-shadow:none;font-weight:400}
.row{display:flex;gap:8px}.row>*{width:auto;flex:1}
.mut{color:var(--mut);font-size:.85rem}
img,video{max-width:100%;border-radius:10px;margin-top:8px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.modal .card{max-width:480px;width:100%;max-height:90vh;overflow:auto}
.re{width:auto;padding:4px 10px;background:#8883;color:var(--ink)}.re.on{background:#fff;color:#2b2b2b;border:2px solid #7a1313;font-weight:700}
.scene{text-align:center;color:#f6ead6;padding:22px 14px 16px;border-radius:18px;background:radial-gradient(circle at 50% 18%,#8c1a1a,#6e1010 75%)}
.tree{display:block;margin:0 auto;width:min(300px,72%);border-radius:0;margin-top:0}
.hello{font-family:'Great Vibes','Snell Roundhand',cursive;font-size:2.7rem;line-height:1;margin:10px 0 0}
.scene h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:1.55rem;margin:0 0 6px}
.scene .card{text-align:left;background:#f6ead6;color:#2b2b2b;margin:14px 0}
.scene .card input,.scene .card select{background:#fff;color:#2b2b2b}
.wr{display:flex;justify-content:center;gap:24px;align-items:flex-end;margin-top:20px}
.cd{display:flex;flex-direction:column;align-items:center;font-size:1.3rem;height:80px;justify-content:flex-end}
.cd span{filter:drop-shadow(0 0 6px #ffb84d)}.cd b{width:14px;height:44px;border-radius:3px}
.ring{height:24px;width:250px;margin:-5px auto 8px;border-radius:50%;background:radial-gradient(circle at 20% 50%,#c62828 3px,transparent 4px),radial-gradient(circle at 55% 40%,#c62828 3px,transparent 4px),radial-gradient(circle at 85% 55%,#c62828 3px,transparent 4px),linear-gradient(#3f8f5f,#1d5a37)}
.handle{font-family:'Cormorant Garamond',Georgia,serif;letter-spacing:.15em;opacity:.85;margin:6px 0 0}
.long{white-space:pre-wrap;max-height:42vh;overflow:auto}
.top{color:#f6ead6}.top .mut{color:#e8d5b8}.top button.sec{background:#f6ead6;color:#2b2b2b;border:1px solid #bfb3a0}
:root{color-scheme:light}
input,select,textarea{color:#2b2b2b;-webkit-text-fill-color:#2b2b2b;caret-color:#2b2b2b;background:#fff}
input::placeholder,textarea::placeholder{color:#8a7f70;-webkit-text-fill-color:#8a7f70;opacity:1}
select option{background:#fff;color:#2b2b2b}
input[type=date],input[type=file]{min-height:44px}
.tab{background:#f6ead6;color:#2b2b2b;border:1px solid #bfb3a0}.tab.on{background:#fff;border:2px solid #7a1313;font-weight:700}
label{display:block;margin:10px 0 0;font-weight:600;color:#4a4136}
main{position:relative;z-index:1}
body::before,body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none}
body::before{background-size:220px 220px;opacity:.9;animation:tw 4s ease-in-out infinite alternate;background-image:radial-gradient(5px 5px at 30px 40px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(4px 4px at 110px 150px,#ffe08a 0 30%,#ffe08a77 55%,transparent),radial-gradient(7px 7px at 170px 60px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(3px 3px at 60px 190px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(5px 5px at 190px 185px,#ffe08a 0 30%,#ffe08a77 55%,transparent),radial-gradient(3px 3px at 130px 20px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(4px 4px at 20px 120px,#ffffff 0 30%,#ffffff77 55%,transparent)}
body::after{background-size:310px 310px;opacity:.85;animation:tw 6s 1.2s ease-in-out infinite alternate-reverse;background-image:radial-gradient(6px 6px at 50px 90px,#ffe08a 0 30%,#ffe08a77 55%,transparent),radial-gradient(4px 4px at 140px 40px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(7px 7px at 250px 150px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(4px 4px at 110px 250px,#ffe08a 0 30%,#ffe08a77 55%,transparent),radial-gradient(5px 5px at 280px 270px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(3px 3px at 200px 230px,#ffffff 0 30%,#ffffff77 55%,transparent),radial-gradient(3px 3px at 20px 200px,#ffe08a 0 30%,#ffe08a77 55%,transparent),radial-gradient(4px 4px at 260px 30px,#ffe08a 0 30%,#ffe08a77 55%,transparent)}
@keyframes tw{from{opacity:.45}to{opacity:1}}
.modal{background:radial-gradient(circle at 50% 30%,#3a0d0dd9,#000000e6)}
.dbox{position:relative;width:100%;max-width:480px;max-height:90vh;display:flex;flex-direction:column}
.dfront{position:relative;z-index:3;display:flex;align-items:center;justify-content:center;gap:12px;height:58px;border-radius:12px 12px 6px 6px;background:linear-gradient(#5d7a35,#3f5524);border:2px solid #c9d9a4;box-shadow:0 6px 14px #0007;color:#fff;font-family:'Cormorant Garamond',Georgia,serif;font-size:1.7rem;font-weight:600}
.dfront .knob{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a520 60%,#9a7210);box-shadow:0 2px 4px #0008}
.dfront small{font-size:.8rem;opacity:.85;letter-spacing:.1em;text-transform:uppercase}
.dbody{position:relative;z-index:1;flex:1;min-height:0;overflow:auto;margin:-8px 6px 0;border-radius:0 0 14px 14px;padding:22px 12px 14px;background:repeating-linear-gradient(90deg,#3b4d22 0 14px,#41562a 14px 28px);border:2px solid #2c3a18;border-top:0;box-shadow:inset 0 10px 14px #0006,0 14px 34px #000a;animation:dOut .8s cubic-bezier(.2,.8,.3,1) both}
@keyframes dOut{from{transform:translateY(-85%);opacity:0}30%{opacity:1}to{transform:none;opacity:1}}
/* calendario dell'avvento */
.cal{background:#4b6128;border-radius:18px;padding:14px 10px;margin:12px 0;box-shadow:0 4px 14px #0006;color:#fff;text-align:center}
.cal h3{font-family:'Cormorant Garamond',Georgia,serif;margin:2px 0 4px;font-size:1.4rem;letter-spacing:.06em}
.cal p{margin:0 0 10px;font-size:.9rem;color:#e6efd0}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dz{position:relative;aspect-ratio:3/4;border-radius:8px;perspective:400px;cursor:default;user-select:none;-webkit-tap-highlight-color:transparent}
.dz .in{position:absolute;inset:0;border-radius:8px;background:#e9f0d6;box-shadow:inset 0 5px 8px #0005;display:flex;align-items:flex-end;justify-content:center;font-size:clamp(1.2rem,6.4vw,2rem);padding-bottom:12%}
.dz .in img{width:80%;margin:0;border-radius:0}
.dz .fr{position:absolute;inset:0;border-radius:8px;display:flex;align-items:flex-start;justify-content:flex-start;padding:4px 0 0 6px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:clamp(.95rem,4.2vw,1.25rem);line-height:1;background:linear-gradient(#587433,#3b4d22);color:#fff;box-shadow:0 2px 4px #0006;transition:transform .7s cubic-bezier(.3,1.3,.5,1);transform-origin:50% 0}
.dz:nth-child(even) .fr{background:linear-gradient(#b9d08c,#9db873);color:#fff;text-shadow:0 1px 2px #0006}
.dz .fr::after{content:"";position:absolute;left:50%;bottom:9px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#d9a520 60%,#9a7210)}
.dz .fr small{font-size:.5em;margin-left:3px;opacity:.9;align-self:flex-end}
.dz.open .fr{transform:translateY(78%) rotateX(-28deg)}
.dz.past{cursor:default}
.dz.lock{opacity:.5;filter:saturate(.5)}
.dz.today{cursor:pointer;animation:glow 1.6s ease-in-out infinite}
.dz.shake{animation:shk .4s}
@keyframes glow{0%,100%{box-shadow:0 0 0 2px #ffe08a,0 0 8px #ffe08a99}50%{box-shadow:0 0 0 3px #fff,0 0 18px #ffe08a}}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.paper{position:relative;z-index:1;background:var(--card);color:#2b2b2b;border-radius:12px;padding:16px;box-shadow:0 4px 14px #0005;animation:rise .7s 1s both}
.paper h3{font-family:'Cormorant Garamond',Georgia,serif;text-align:center;font-size:1.4rem;margin:2px 0 10px}
.paper h3::after{content:"✦ ✦ ✦";display:block;font-size:.6rem;letter-spacing:.4em;color:#c9a227;margin-top:2px}
.pg{animation:slide .35s}
.dots span{display:inline-block;width:9px;height:9px;border-radius:50%;background:#cdbd9f;margin:0 4px;transition:.2s}.dots span.on{background:#b71c1c;transform:scale(1.3)}
@keyframes lid{to{transform:translate(-26px,-130px) rotate(-16deg);opacity:0;visibility:hidden}}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.95)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.tabs{flex-wrap:wrap}.tabs>*{min-width:45%}
@media(prefers-reduced-motion:reduce){body::before,body::after{animation:none}.dbody,.dz.today{animation:none}.dz .fr{transition:none}.paper,.pg{animation:none}}
.chips{margin:6px 0}.chip{display:inline-block;background:#fff;border:1px solid #cdbd9f;border-radius:14px;padding:3px 10px;margin:3px 4px 3px 0;font-size:.82rem}.chip a{cursor:pointer;margin-left:6px;color:#b71c1c;font-weight:700}
audio{width:100%;margin-top:8px}

}
function loginView(){
  let reg=false;
  app.innerHTML=scene(`<div class="card">
  <input id="nick" placeholder="Nickname" maxlength="20" autocapitalize="none" autocomplete="username">
  <input id="pw" type="password" placeholder="Password (almeno 6 caratteri)" autocomplete="current-password">
  <select id="br" style="display:none">${OPTS}</select>
  <button id="go">Entra</button><button class="sec" id="tg">Prima volta? Registrati</button><p id="msg" class="mut"></p></div>`);
  $('#tg').onclick=()=>{reg=!reg;$('#br').style.display=reg?'':'none';$('#go').textContent=reg?'Registrati':'Entra';
    $('#tg').textContent=reg?'Ho già un account':'Prima volta? Registrati';$('#msg').textContent='';};
  $('#go').onclick=async()=>{
    const nick=$('#nick').value.trim(), pw=$('#pw').value, br=$('#br').value, msg=$('#msg');
    if(!/^[a-z0-9_.-]{3,20}$/i.test(nick)) return msg.textContent='Nickname: 3-20 caratteri, solo lettere, numeri, _ . -';
    if(pw.length<6) return msg.textContent='La password deve avere almeno 6 caratteri.';
    if(reg){
      if(!br) return msg.textContent='Scegli la branca.';
      if(br==='capi'&&await capiFull()) return msg.textContent=NOCAPO;
      const {data,error}=await sb.auth.signUp({email:mail(nick),password:pw});
      if(error) return msg.textContent=/registered|exists/i.test(error.message)?'Nickname già usato, scegline un altro.':error.message;
      if(!data.session) return msg.textContent='Registrazione non completata: su Supabase disattiva "Confirm email".';
      const r=await sb.from('profiles').insert({id:data.user.id,nickname:nick,branca:br});
      if(r.error) return msg.textContent=r.error.message.includes('capi_limit')?NOCAPO:r.error.code==='23505'?'Nickname già usato, scegline un altro.':r.error.message;
    } else {
      const {error}=await sb.auth.signInWithPassword({email:mail(nick),password:pw});
      if(error) return msg.textContent='Nickname o password errati.';
    }
    init();
  };
}

function onboardView(){
  app.innerHTML=scene(`<div class="card"><h3>Benvenuto! Completa il profilo</h3>
  <input id="nick" placeholder="Nickname" maxlength="20"><select id="br">${OPTS}</select>
  <button id="ok">Entra</button><p id="msg" class="mut"></p></div>`);
  $('#ok').onclick=async()=>{
    const nickname=$('#nick').value.trim(), branca=$('#br').value, msg=$('#msg');
    if(!nickname||!branca) return msg.textContent='Compila tutti i campi.';
    if(branca==='capi'&&await capiFull()) return msg.textContent=NOCAPO;
    const {error}=await sb.from('profiles').insert({id:session.user.id,nickname,branca});
    if(error) return msg.textContent=error.message.includes('capi_limit')?NOCAPO:error.code==='23505'?'Nickname già usato, scegline un altro.':error.message;
    init();
  };
}

// Per usare i tuoi disegni al posto delle emoji scrivi un percorso immagine, es. '12-05':'img/05.png'
const CAL_ART={'11-30':'🐻‍❄️','12-01':'🕯️','12-02':'🌺','12-03':'⛸️','12-04':'🔔','12-05':'🎀','12-06':'☕','12-07':'⛄','12-08':'🎍','12-09':'🍪','12-10':'🌿','12-11':'🎐','12-12':'🍵','12-13':'💂','12-14':'🔮','12-15':'🍃','12-16':'🌰','12-17':'🎈','12-18':'🍒','12-19':'🌲','12-20':'☕','12-21':'🎄','12-22':'🍭','12-23':'🪩','12-24':'👼','12-25':'🛻'};
function calDays(){
  const a=['2026-11-30']; for(let d=1;d<=25;d++) a.push('2026-12-'+String(d).padStart(2,'0'));
  if(today<a[0]&&today>=START) a.unshift(today); // solo in PROVA: aggiunge il giorno di oggi
  return a;
}
function calendarView(){
  const art=d=>{const v=CAL_ART[d.slice(5)]||'🎁';return /^img\//.test(v)?`<img src="${v}" alt="">`:v;};
  const cells=calDays().map(d=>{
    const st=d<today?'past open':d===today?'today':'lock';
    return `<div class="dz ${st}" data-d="${d}"><div class="in">${art(d)}</div><div class="fr">${+d.slice(8)}${d.startsWith('2026-11')?'<small>nov</small>':''}</div></div>`;}).join('');
  $('#body').innerHTML=`<div class="cal"><h3>Calendario dell'Avvento</h3><p>Tocca la casella di oggi per aprire il cassetto e scoprire la sfida. Per vedere i post degli altri devi prima completarla!</p><div class="cgrid">${cells}</div></div>`;
  document.querySelectorAll('.dz').forEach(el=>el.onclick=()=>{
    if(el.classList.contains('lock')||el.classList.contains('past')){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return;}
    if(document.querySelector('.modal')) return;
    el.classList.add('open'); el.classList.remove('today');
    setTimeout(()=>{challengeModal();el.classList.add('today');},matchMedia('(prefers-reduced-motion:reduce)').matches?0:750);
  });
}

const MAXF=10, MAXC=4, MAXMB=50;
const kindOf=f=>/^video/.test(f.type)||/\.(mp4|mov|webm|m4v)$/i.test(f.name)?'video':/^audio/.test(f.type)||/\.(mp3|m4a|wav|ogg|oga|aac|opus|amr)$/i.test(f.name)?'audio':'image';
const ICON={image:'🖼️',video:'🎬',audio:'🎵'};
const extOf=n=>((n.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5))||'bin';
const shortN=n=>n.length>22?n.slice(0,19)+'…':n;
const mediaHtml=(m,urls)=>{const u=urls[m.path];if(!u)return '';return m.type==='video'?`<video src="${u}" controls playsinline></video>`:m.type==='audio'?`<audio src="${u}" controls></audio>`:`<img src="${u}" loading="lazy">`;};
function chips(box,files){
  box.innerHTML=files.map((f,i)=>`<span class="chip">${ICON[kindOf(f)]} ${esc(shortN(f.name))} <a data-x="${i}">✕</a></span>`).join('');
  box.querySelectorAll('[data-x]').forEach(a=>a.onclick=()=>{files.splice(+a.dataset.x,1);chips(box,files);});
}
function pickFiles(files,max,box,msg){
  const inp=document.createElement('input'); inp.type='file'; inp.multiple=true; inp.accept='image/*,video/*,audio/*'; inp.style.display='none'; document.body.appendChild(inp);
  inp.onchange=()=>{
    for(const f of inp.files){
      if(files.length>=max){ if(msg) msg.textContent='Puoi allegare al massimo '+max+' file.'; break; }
      if(f.size>MAXMB*1048576){ if(msg) msg.textContent=shortN(f.name)+' supera '+MAXMB+' MB.'; continue; }
      files.push(f);
    }
    chips(box,files); inp.remove();
  };
  inp.click();
}
async function uploadFiles(files,prefix){
  const out=[];
  for(let i=0;i<files.length;i++){
    const f=files[i], path=`${me.id}/${prefix}-${Date.now()}-${i}.${extOf(f.name)}`;
    const u=await sb.storage.from('media').upload(path,f);
    if(u.error){ if(out.length) await sb.storage.from('media').remove(out.map(x=>x.path)); throw new Error('Errore upload di '+f.name+': '+u.error.message); }
    out.push({path,type:kindOf(f),name:f.name});
  }
  return out;
}

  <textarea id="tx" rows="4" placeholder="Racconta la tua attività...">${esc(edit?.text_content||'')}</textarea>
  <div id="ex" class="chips"></div>
  <button type="button" class="sec" id="af" style="width:100%">📎 Aggiungi foto, video o audio</button>
  <div id="nf" class="chips"></div><p class="mut" style="margin:4px 0 0">Puoi allegare più file (max ${MAXF}, ${MAXMB} MB ciascuno).</p></div>
  <div class="dots" id="st" style="text-align:center;margin:12px 0 4px"></div>
  <div class="row"><button class="sec" id="cl">Chiudi</button><button class="sec" id="bk">←</button><button id="nx">Avanti →</button><button id="sd">${edit?'Salva':'Pubblica'}</button></div><p id="msg" class="mut"></p>
  </div></div></div>`;
  document.body.appendChild(m);
  const pg=m.querySelectorAll('.pg');
  const go=n=>{step=n;pg.forEach((p,i)=>p.style.display=i===n?'':'none');
    $('#st').innerHTML=[0,1,2].map(i=>`<span class="${i===n?'on':''}"></span>`).join('');
    $('#bk').style.display=n?'':'none';$('#nx').style.display=n<2?'':'none';$('#sd').style.display=n===2?'':'none';};
  const drawEx=()=>{const b=$('#ex');b.innerHTML=keep.map((f,i)=>`<span class="chip">${ICON[f.type]} ${esc(shortN(f.name||'allegato'))} <a data-k="${i}">✕</a></span>`).join('');
    b.querySelectorAll('[data-k]').forEach(a=>a.onclick=()=>{removed.push(keep.splice(+a.dataset.k,1)[0]);drawEx();});};
  drawEx();
  $('#af').onclick=()=>pickFiles(files,MAXF-keep.length,$('#nf'),$('#msg'));
  $('#cl').onclick=()=>m.remove(); $('#bk').onclick=()=>go(step-1); $('#nx').onclick=()=>go(step+1); go(step);
  $('#sd').onclick=async()=>{
    const text=$('#tx').value.trim(), msg=$('#msg'), btn=$('#sd');
    if(!text&&!files.length&&!keep.length) return msg.textContent='Aggiungi un testo, una foto, un video o un audio.';
    btn.disabled=true; msg.textContent='Salvataggio in corso (i file grandi richiedono un po\')...';
    let up=[]; try{up=await uploadFiles(files,today);}catch(e){btn.disabled=false;return msg.textContent=e.message;}
    const undo=async()=>{if(up.length) await sb.storage.from('media').remove(up.map(x=>x.path)); btn.disabled=false;};
    let pid=edit?.id;
    if(edit){ const {error}=await sb.from('posts').update({text_content:text||null}).eq('id',pid); if(error){await undo();return msg.textContent=error.message;} }
    else { const {data,error}=await sb.from('posts').insert({user_id:me.id,day:today,text_content:text||null}).select('id').single(); if(error){await undo();return msg.textContent=error.message;} pid=data.id; }
    if(up.length){ const r=await sb.from('post_media').insert(up.map(x=>({post_id:pid,...x}))); if(r.error){btn.disabled=false;return msg.textContent=r.error.message;} }
    if(removed.length){ await sb.from('post_media').delete().in('id',removed.map(x=>x.id)); await sb.storage.from('media').remove(removed.map(x=>x.path)); }
    m.remove(); mainView();
  };
}

const brSel=id=>`<label class="mut">Branca</label><select id="${id}"><option value="">Tutte le branche</option>${BRANCHE.map(b=>`<option value="${b}">${b}</option>`).join('')}</select>`;
const userOpts=(users,br,ph)=>`<option value="">${ph}</option>`+users.filter(u=>!br||u.branca===br).map(u=>`<option value="${u.id}">${esc(u.nickname)} (${esc(u.branca)})</option>`).join('');
const SEL='*,profiles!posts_user_id_fkey(nickname,branca),post_media(id,path,type,name),comments(id,user_id,text_content,profiles!comments_user_id_fkey(nickname),comment_media(id,path,type,name)),reactions(emoji,user_id,profiles!reactions_user_id_fkey(nickname))';

async function loadFeed(day,sel='#body'){
  const box=$(sel); box.innerHTML='<p>Carico...</p>';
  const {data:posts,error}=await sb.from('posts').select(SEL).eq('day',day).order('created_at',{ascending:false});
  if(error) return box.innerHTML=`<div class="card">${esc(error.message)}</div>`;
  const paths=[]; posts.forEach(p=>{(p.post_media||[]).forEach(m=>paths.push(m.path));p.comments.forEach(c=>(c.comment_media||[]).forEach(m=>paths.push(m.path)));});
  const urls={};
  if(paths.length){const r=await sb.storage.from('media').createSignedUrls(paths,3600);(r.data||[]).forEach(x=>urls[x.path]=x.signedUrl);}
  const pending={};
  box.innerHTML=(posts.length?'':'<div class="card">Ancora nessun post.</div>')+posts.map(p=>{
    const media=(p.post_media||[]).map(m=>mediaHtml(m,urls)).join('');
    const re=EMOJI.map(e=>{const n=p.reactions.filter(r=>r.emoji===e).length,on=p.reactions.some(r=>r.emoji===e&&r.user_id===me.id);
      return `<button class="re ${on?'on':''}" data-p="${p.id}" data-e="${e}" data-on="${on}">${e} ${n||''}</button>`}).join(' ');
    const who=EMOJI.map(e=>{const n=p.reactions.filter(r=>r.emoji===e).map(r=>r.profiles?.nickname).filter(Boolean);return n.length?`<div class="mut">${e} ${esc(n.join(', '))}</div>`:''}).join('');
    const cm=p.comments.map(c=>`<div style="margin:8px 0"><b>${esc(c.profiles?.nickname)}</b>${c.text_content?': '+esc(c.text_content):''}${(c.comment_media||[]).map(m=>mediaHtml(m,urls)).join('')}</div>`).join('');
    const ed=p.user_id===me.id&&p.day===today?`<button class="sec" style="width:auto;float:right;margin:0" data-edit="${p.id}">✏️ Modifica</button>`:'';
    return `<div class="card"><b>${esc(p.profiles.nickname)}</b> <span class="mut">${esc(p.profiles.branca)}</span>${ed}
      <p>${esc(p.text_content)}</p>${media}<div style="margin-top:8px">${re}</div>${who}${cm}
      <div id="cf${p.id}" class="chips"></div>
      <div class="row"><input placeholder="Commenta..." maxlength="500" id="c${p.id}"><button class="sec" data-a="${p.id}" title="Allega foto, video o audio" style="flex:none;width:auto">📎</button><button data-c="${p.id}" style="flex:none;width:auto">Invia</button></div></div>`}).join('');
  box.querySelectorAll('.re').forEach(b=>b.onclick=async()=>{
    const rq=sb.from('reactions'); b.dataset.on==='true'
      ? await rq.delete().match({post_id:b.dataset.p,user_id:me.id,emoji:b.dataset.e})
      : await rq.insert({post_id:b.dataset.p,user_id:me.id,emoji:b.dataset.e});
    loadFeed(day,sel)});
  box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>challengeModal(posts.find(x=>x.id===b.dataset.edit)));
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const id=b.dataset.a;pickFiles(pending[id]||(pending[id]=[]),MAXC,$('#cf'+id),null);});
  box.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.c, t=$('#c'+id).value.trim(), fs=pending[id]||[];
    if(!t&&!fs.length) return;
    b.disabled=true; let up=[];
    try{up=await uploadFiles(fs,'c'+today);}catch(e){b.disabled=false;return alert(e.message);}
    const {data:c,error}=await sb.from('comments').insert({post_id:id,user_id:me.id,text_content:t}).select('id').single();
    if(error){if(up.length) await sb.storage.from('media').remove(up.map(x=>x.path)); b.disabled=false; return alert(error.message);}
    if(up.length) await sb.from('comment_media').insert(up.map(x=>({comment_id:c.id,...x})));
    loadFeed(day,sel);
  });
}

const CD_START=new Date('2026-12-26T00:00:00+01:00'), UNLOCK=new Date('2026-12-31T00:00:00+01:00');
let cdTimer;
function countdown(){
  clearInterval(cdTimer); const box=$('#cd'); if(!box) return;
  const tick=()=>{
    const now=Date.now(), ms=UNLOCK-now;
    if(now<CD_START){box.innerHTML='';return;}
    if(ms<=0){box.innerHTML='';clearInterval(cdTimer);loadMyFiles();return;}
    const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),m=Math.floor(ms%36e5/6e4),sc=Math.floor(ms%6e4/1e3), p=n=>String(n).padStart(2,'0');
    box.innerHTML=`<div class="card" style="text-align:center"><b>🎁 Manca poco al tuo regalo!</b><div style="font-size:1.8rem;font-weight:700;margin:6px 0">${d}g ${p(h)}:${p(m)}:${p(sc)}</div><span class="mut">Il file riservato a te si apre a mezzanotte del 31 dicembre</span></div>`;
  };
  tick(); cdTimer=setInterval(tick,1000);
}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),10000);}
const BRANCHE=['lupetti','esploratori','rover','capi'];
async function recapView(){
  const y=new Date(Date.now()-6*36e5-864e5).toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});
  $('#admbox').innerHTML=`<div class="card"><b>📁 Recap giornalieri</b>
  <p class="mut">Ogni notte a mezzanotte l'app prepara da sola il recap del giorno appena finito, diviso per branca.</p>
  ${brSel('rbr')}<label class="mut">Giorno</label><input type="date" id="rd" value="${y}"><div class="row"><button class="sec" id="rg">Genera ora</button><button id="rz">⬇️ ZIP del giorno</button></div>
  <button id="ra">⬇️ ZIP di tutti i giorni</button><p id="rmsg" class="mut"></p></div><div id="rlist"></div>`;
  let rows=[];
  const load=async()=>{
    const {data,error}=await sb.from('recaps').select('*').eq('day',$('#rd').value).order('nickname');
    if(error) return $('#rlist').innerHTML=`<div class="card">${esc(error.message)}</div>`;
    rows=data||[];
    const vis=rows.filter(x=>!$('#rbr').value||x.branca===$('#rbr').value);
    $('#rlist').innerHTML=vis.length?BRANCHE.map(b=>{const r=vis.filter(x=>x.branca===b);
      return r.length?`<div class="card"><b>📁 ${b} (${r.length})</b>${r.map(x=>`<details><summary>${esc(x.nickname)}</summary><pre style="white-space:pre-wrap;font:inherit">${esc(x.content)}</pre></details>`).join('')}</div>`:'';}).join('')
      :'<div class="card">Nessun recap per questo giorno. Premi "Genera ora" per prepararlo subito.</div>';
  };
  const zip=async(list,name)=>{
    const m=$('#rmsg'); if(!window.JSZip) return m.textContent='Libreria ZIP non caricata: ricarica la pagina.';
    if(!list.length) return m.textContent='Nessun recap da scaricare.';
    const z=new JSZip(); list.forEach(r=>z.file(`${r.branca}/${r.nickname}/${r.day}.txt`,r.content));
    saveBlob(await z.generateAsync({type:'blob'}),name); m.textContent='Download avviato ✅';
  };
  $('#rd').onchange=load; $('#rbr').onchange=load;
  $('#rg').onclick=async()=>{$('#rmsg').textContent='Preparo il recap...';
    const {error}=await sb.rpc('genera_recap_admin',{d:$('#rd').value}); $('#rmsg').textContent=error?error.message:'Recap pronto ✅'; load();};
  $('#rz').onclick=()=>zip(rows.filter(x=>!$('#rbr').value||x.branca===$('#rbr').value),`recap_${$('#rd').value}.zip`);
  $('#ra').onclick=async()=>{
    $('#rmsg').textContent='Raccolgo tutti i recap...'; let all=[],from=0;
    for(;;){const {data,error}=await sb.from('recaps').select('*').order('day').range(from,from+999);
      if(error) return $('#rmsg').textContent=error.message; all=all.concat(data); if(data.length<1000) break; from+=1000;}
    zip(all.filter(x=>!$('#rbr').value||x.branca===$('#rbr').value),'recap_tutti_i_giorni.zip');};
  load();
}
function openFile(path,name,dl){
  const w=dl?null:window.open('','_blank');
  sb.storage.from('riservati').createSignedUrl(path,3600,dl?{download:name}:undefined).then(({data,error})=>{
    if(error){w&&w.close();return alert('Impossibile aprire il file.');}
    if(dl||!w) location.href=data.signedUrl; else w.location=data.signedUrl;
  });
}
const fileBtns=(i)=>`<button class="sec" data-o="${i}" style="width:auto">Apri</button> <button class="sec" data-d="${i}" style="width:auto">⬇️ Scarica</button>`;
function bindFiles(box,rows){
  box.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const f=rows[b.dataset.o];openFile(f.file_path,f.file_name,false)});
  box.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const f=rows[b.dataset.d];openFile(f.file_path,f.file_name,true)});
}
async function loadMyFiles(){
  const {data}=await sb.from('user_files').select('*').eq('user_id',me.id).order('created_at',{ascending:false});
  const box=$('#files'); if(!box) return;
  if(!data||!data.length){box.innerHTML='';return;}
  box.innerHTML=`<div class="card"><b>📎 File per te</b>${data.map((f,i)=>`<p>${esc(f.file_name)}${f.note?`<br><span class="mut">${esc(f.note)}</span>`:''}<br>${fileBtns(i)}</p>`).join('')}</div>`;
  bindFiles(box,data);
}

async function accountView(){
  const box=$('#admbox'); box.innerHTML='<p>Carico...</p>';
  const {data,error}=await sb.rpc('admin_lista_account');
  if(error) return box.innerHTML=`<div class="card">${esc(error.message)}</div>`;
  const dt=x=>x?new Date(x).toLocaleString('it-IT'):'mai';
  box.innerHTML=`<div class="card"><b id="acn">👥 Account (${data.length})</b>
  <p class="mut">Le password non sono leggibili da nessuno, nemmeno da te: sono salvate cifrate. Se un utente la dimentica, puoi impostarne una nuova e comunicargliela.</p>
  ${brSel('acb')}<div id="acl"></div></div>`;
  const draw=()=>{
    const br=$('#acb').value, list=data.filter(x=>!br||x.branca===br), l=$('#acl');
    l.innerHTML=BRANCHE.map(b=>{const r=list.filter(x=>x.branca===b);return r.length?`<b>📁 ${b} (${r.length})</b>${r.map(x=>`<p>${esc(x.nickname)}${x.is_admin?' ⭐':''}<br><span class="mut">ultimo accesso: ${dt(x.ultimo_accesso)}</span><br><button class="sec" data-r="${x.id}" data-n="${esc(x.nickname)}" style="width:auto">🔑 Reimposta password</button>${x.id===me.id?'':` <button class="sec" data-del="${x.id}" data-n="${esc(x.nickname)}" style="width:auto">🗑️ Elimina</button>`}</p>`).join('')}`:'';}).join('')||'<p class="mut">Nessun account in questa branca.</p>';
    l.querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{
      const gen=Array.from(crypto.getRandomValues(new Uint32Array(8)),n=>'abcdefghjkmnpqrstuvwxyz23456789'[n%31]).join('');
      const pw=prompt('Nuova password per '+b.dataset.n+' (minimo 6 caratteri):',gen); if(!pw) return;
      const {error}=await sb.rpc('admin_reimposta_password',{uid:b.dataset.r,nuova:pw});
      alert(error?'Errore: '+error.message:'Password di '+b.dataset.n+' reimpostata.\nNuova password: '+pw+'\nComunicala all\'utente: non verrà più mostrata.');
    });
    l.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      const n=b.dataset.n, id=b.dataset.del;
      if(prompt('ATTENZIONE: stai eliminando DEFINITIVAMENTE l\'account di '+n+' con tutti i suoi post, commenti, reazioni e file.\nPer confermare scrivi il suo nickname:')!==n) return;
      const {error}=await sb.rpc('admin_elimina_account',{uid:id});
      if(error) return alert('Errore: '+error.message);
      for(const bk of ['media','riservati']){
        const {data:fl}=await sb.storage.from(bk).list(id,{limit:1000});
        if(fl&&fl.length) await sb.storage.from(bk).remove(fl.map(f=>`${id}/${f.name}`));
      }
      data.splice(data.findIndex(x=>x.id===id),1); $('#acn').textContent=`👥 Account (${data.length})`; draw();
      alert('Account di '+n+' eliminato.');
    });
  };
  $('#acb').onchange=draw; draw();
}

async function adminView(){
  const {data:users}=await sb.from('profiles').select('id,nickname,branca').order('nickname');
  const u=users||[];
  $('#body').innerHTML=`<div class="row tabs"><button class="tab" id="t1">📎 File riservati</button><button class="tab" id="t2">📁 Recap</button><button class="tab" id="t3">👥 Account</button></div><div id="admbox"></div>`;
  const tab=(n,f)=>{[1,2,3].forEach(i=>$('#t'+i).classList.toggle('on',i===n));f();};
  $('#t1').onclick=()=>tab(1,()=>riservati(u)); $('#t2').onclick=()=>tab(2,recapView); $('#t3').onclick=()=>tab(3,accountView); tab(1,()=>riservati(u));
}
async function riservati(users){
  $('#admbox').innerHTML=`<div class="card"><b>📎 Invia un file a un utente</b>
  <p class="mut">Solo il destinatario (e gli admin) potrà vederlo e scaricarlo. Massimo 50 MB.</p>
  ${brSel('rb')}<select id="ru">${userOpts(users,'','Scegli il destinatario')}</select>
  <input id="rf" type="file"><input id="rn" placeholder="Nota (facoltativa)" maxlength="200">
  <button id="rs">Invia</button><p id="rm" class="mut"></p></div><div id="rl"></div>`;
  $('#rb').onchange=()=>{$('#ru').innerHTML=userOpts(users,$('#rb').value,'Scegli il destinatario');};
  let rows=[];
  const list=async()=>{
    const {data}=await sb.from('user_files').select('*,profiles!user_files_user_id_fkey(nickname)').order('created_at',{ascending:false});
    rows=data||[]; const box=$('#rl');
    box.innerHTML=`<div class="card"><b>File inviati</b>${rows.length?rows.map((f,i)=>`<p><b>${esc(f.profiles?.nickname)}</b> · ${esc(f.file_name)}<span class="mut"> · ${new Date(f.created_at).toLocaleDateString('it-IT')}</span>${f.note?`<br><span class="mut">${esc(f.note)}</span>`:''}<br>${fileBtns(i)} <button class="sec" data-x="${i}" style="width:auto">🗑️ Elimina</button></p>`).join(''):'<p class="mut">Nessun file inviato.</p>'}</div>`;
    bindFiles(box,rows);
    box.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{
      const f=rows[b.dataset.x]; if(!confirm('Eliminare "'+f.file_name+'"?')) return;
      await sb.storage.from('riservati').remove([f.file_path]); await sb.from('user_files').delete().eq('id',f.id); list();});
  };
  $('#rs').onclick=async()=>{
    const uid=$('#ru').value, f=$('#rf').files[0], note=$('#rn').value.trim(), m=$('#rm');
    if(!uid||!f) return m.textContent='Scegli il destinatario e un file.';
    m.textContent='Caricamento in corso...';
    const safe=f.name.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_');
    const path=`${uid}/${Date.now()}_${safe}`;
    const up=await sb.storage.from('riservati').upload(path,f);
    if(up.error) return m.textContent='Errore upload: '+up.error.message;
    const ins=await sb.from('user_files').insert({user_id:uid,file_path:path,file_name:f.name,note:note||null});
    if(ins.error){await sb.storage.from('riservati').remove([path]);return m.textContent=ins.error.message;}
    m.textContent='File inviato ✅'; $('#rf').value=''; $('#rn').value=''; list();
  };
  list();
}
init();
</script></body></html>
